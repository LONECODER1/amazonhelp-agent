version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_amazon
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: amazonhelp_agent
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - USE_LOCAL_QDRANT=false
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=amazon_support
      - SQLITE_PATH=/app/checkpoints/chat_checkpoints.db
    env_file:
      - .env
    volumes:
      - app_checkpoints:/app/checkpoints
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  app_checkpoints:
